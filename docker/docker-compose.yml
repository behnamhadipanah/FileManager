name: filemanager

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: filemanager-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - filemanager

  rustfs:
    image: rustfs/rustfs:latest
    container_name: filemanager-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin123"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped
    networks:
      - filemanager

  filemanager-api:
    build:
      context: ..
      dockerfile: docker/FileManager.Api.Dockerfile
    image: filemanager-api:local
    container_name: filemanager-api
    depends_on:
      sqlserver:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      SqlServer__AutoMigrate: "true"
      SqlServer__ConnectionString: "Server=sqlserver,1433;Database=FileManager;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Application Name=FileManager;"
      RustFs__ServiceUrl: "http://rustfs:9000"
      RustFs__PublicServiceUrl: "http://localhost:9100"
      RustFs__AccessKey: "rustfsadmin"
      RustFs__SecretKey: "rustfsadmin123"
      RustFs__ForcePathStyle: "true"
      Jwt__Key: "FileManager-Super-Secret-Jwt-Key-At-Least-32-Chars!"
      Jwt__Issuer: "FileManager"
      Jwt__Audience: "FileManager"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "7"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - filemanager

networks:
  filemanager:
    driver: bridge

volumes:
  sqlserver-data:
  rustfs-data:
